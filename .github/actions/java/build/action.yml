name: Java @ Build
description: '[Composite] Build a Java project'

inputs:
  fetch-depth:
    description: 'Number of commits to fetch'
    default: '1'
    required: false
  lfs:
    description: 'Download Git-LFS files'
    default: 'false'
    required: false
  submodules:
    description: 'Checkout submodules'
    default: 'false'
    required: false
  java-version:
    description: 'Java version to use'
    required: false
    default: '17'
  java-distribution:
    description: 'Java distribution to use'
    required: false
    default: 'temurin'
  build-command:
    description: 'Custom build command to execute'
    required: false
    default: 'mvn -B clean compile'
  custom-build-arguments:
    description: 'Additional arguments for the build command'
    required: false
    default: ''
  cache-enabled:
    description: 'Whether to use Maven dependency caching'
    required: false
    default: 'false'
  working-directory:
    description: 'Working directory where the build should run'
    required: false
    default: '.'
  maven-settings-path:
    description: 'Path to maven settings.xml file in the repository'
    required: false
    default: 'maven-settings.xml'

runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: euthiagodealmeida/conveyor-actions/.github/actions/shared/checkout@develop
      id: checkout
      with:
        fetch-depth: ${{ inputs.fetch-depth }}
        lfs: ${{ inputs.lfs }}
        submodules: ${{ inputs.submodules }}

    - name: Set up JDK ${{ inputs.java-version }} (${{ inputs.java-distribution }})
      uses: actions/setup-java@v3
      with:
        distribution: ${{ inputs.java-distribution }}
        java-version: ${{ inputs.java-version }}
        cache: ${{ (inputs.cache-enabled == 'true') && 'maven' || '' }}

    - name: Setup Maven Settings
      shell: bash
      run: |
        mkdir -p ~/.m2
        if [ -f "${{ github.workspace }}/${{ inputs.maven-settings-path }}" ]; then
          cp "${{ github.workspace }}/${{ inputs.maven-settings-path }}" ~/.m2/settings.xml
          echo "Using custom Maven settings from repository at ${{ inputs.maven-settings-path }}"
        else
          echo "<settings><mirrors><mirror><id>central</id><url>https://repo1.maven.org/maven2</url><mirrorOf>central</mirrorOf></mirror></mirrors></settings>" > ~/.m2/settings.xml
          echo "Using default Maven settings"
        fi

    - name: Build with Maven
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        echo "JAVA VERSION:"
        java -version
        echo "MAVEN VERSION:"
        mvn --version
        
        export MAVEN_OPTS='-Xmx2g'
        echo "Executing: ${{ inputs.build-command }} ${{ inputs.custom-build-arguments }}"
        ${{ inputs.build-command }} ${{ inputs.custom-build-arguments }}

    - name: Generate cache key
      id: cache-key
      shell: bash
      run: |
        echo "Generating cache key based on pom.xml and current commit"
        echo "key=build-${{ github.sha }}-${{ github.run_id }}" >> $GITHUB_OUTPUT
  
    - name: Cache target directory
      uses: euthiagodealmeida/conveyor-actions/.github/actions/shared/cache@develop
      with:
        operation: 'save'
        path: ${{ inputs.working-directory }}/target
        cache-key: ${{ steps.cache-key.outputs.key }}